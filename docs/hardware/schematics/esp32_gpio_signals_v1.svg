<text x="410" y="970" font-size="13" style="fill:#576579" font-weight="400" text-anchor="start">전원·OE: 시트 02</text>
<text x="410" y="994" font-size="13" style="fill:#576579" font-weight="400" text-anchor="start">A/B는 IC 기준 명칭</text>
<text x="705" y="970" font-size="16" style="fill:#576579" font-weight="400" text-anchor="start">UART0 GPIO43/44</text>
<text x="705" y="997" font-size="16" style="fill:#576579" font-weight="400" text-anchor="start">보드 내부 USB-UART 전용</text>
<text x="705" y="1024" font-size="16" style="fill:#576579" font-weight="400" text-anchor="start">외부 장치에 중복 배정 금지</text>
<text x="50" y="1080" font-size="18" style="fill:#576579" font-weight="400" text-anchor="start">IMU: 3Vo, I2 및 상단 SCX / SDX / CS / DO / GND는 이번 배선에서 사용하지 않습니다.</text>
<text x="50" y="1111" font-size="18" style="fill:#576579" font-weight="400" text-anchor="start">CF: IC·LV/HV·OE 회로와 5 V→3.3 V 파형 확인 전 연결 보류. 엔코더 HA/HB를 ESP32에 직접 연결하지 않습니다.</text>
<text x="50" y="1142" font-size="18" style="fill:#576579" font-weight="400" text-anchor="start">현재 펌웨어는 IMU 진단용입니다. 이 도면만으로 모터·서보의 부팅/리셋/통신 단절 시 정지가 구현되지는 않습니다.</text>
<text x="50" y="1204" font-size="16" style="fill:#576579" font-weight="400" text-anchor="start">IT ARENA · 2026-11-11 · v1 | 단자 이름 기준 배선도 · 기판 핀의 물리적 순서/위치를 나타내지 않음</text>
