<text x="50" y="1364" font-size="16" style="fill:#576579" font-weight="400" text-anchor="start">IT ARENA · 2026-11-12 · v1 근거 갱신 | 단자 이름 기준 배선도 · 기판 핀의 물리적 순서/위치를 나타내지 않음</text>
