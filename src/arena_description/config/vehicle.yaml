# Provisional geometry. Replace values as soon as the hardware team supplies measurements.
vehicle:
  status: provisional
  # Sensor xyz values are relative to the model origin at ground level midway
  # between the axles. This convention is provisional but explicit.
  reference_frame: model_origin

  # Regulation envelope currently reported by the team.
  rule_envelope:
    max_length_m: 0.20
    max_width_m: 0.15
    max_height_m: null

  # Conservative first model, not a confirmed chassis design.
  body:
    length_m: 0.18
    width_m: 0.12
    height_m: 0.06
    mass_kg: 1.5

  drivetrain:
    layout: rear_wheel_drive_ackermann
    wheelbase_m: 0.13
    track_width_m: 0.105
    wheel_radius_m: 0.025
    wheel_width_m: 0.012
    max_steering_angle_rad: 0.45
    max_speed_mps: 2.0

  sensors:
    # Candidate real-car baseline: one quadrature encoder per driven rear wheel.
    # Gazebo exposes ideal wheel joints; sim_wheel_encoder converts them into
    # finite-resolution, sampled and delayed feedback behind stable ROS topics.
    wheel_encoders:
      enabled: true
      left_joint_name: rear_left_wheel_joint
      right_joint_name: rear_right_wheel_joint
      ticks_per_revolution: 2048
      sample_rate_hz: 100.0
      latency_ms: 2.0
      dropout_probability: 0.0
      mount_note: candidate; measure at wheel or account for gear ratio explicitly
      status: provisional
    d435i:
      enabled: true
      xyz_m: [0.055, 0.0, 0.075]
      rpy_rad: [0.0, 0.0, 0.0]
      rgb_horizontal_fov_rad: 1.2043
      width_px: 848
      height_px: 480
      update_rate_hz: 30.0
      minimum_depth_m: 0.10
      maximum_depth_m: 6.0
      model_note: combined RGB-D approximation; split RGB/depth intrinsics later
      status: provisional
    lidar_2d:
      enabled: false
      xyz_m: [0.0, 0.0, 0.055]
      rpy_rad: [0.0, 0.0, 0.0]
      status: candidate
    tof_front_left:
      enabled: false
      xyz_m: [0.085, 0.045, 0.025]
      rpy_rad: [0.0, 0.0, 0.20]
      status: candidate
    tof_front_right:
      enabled: false
      xyz_m: [0.085, -0.045, 0.025]
      rpy_rad: [0.0, 0.0, -0.20]
      status: candidate
