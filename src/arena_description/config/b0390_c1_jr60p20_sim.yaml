# 2026-11-04 사용자 선택: 최종 CAD 전 임시 차량 JR60P20(센서 +60 mm·앞 지주 +20 mm).
# 2026-11-07 B0390 교체; JR60P20 장착 유지. 신규 단독·교통 시뮬 기준. CAD/실차 확정값 아님. 실행 시 ID49 중심 0.140 m와 함께 사용.
# 이전 기준 b0183_c1_jr50_sim.yaml(얇은 2 mm 합성 배선)은 재현용으로 보존한다.
# 구매 모델과 장착/오차 가정을 구분한 새 선택형 구성. 기존 vehicle.yaml 보존.
camera:
  model: Arducam_B0390_IMX219
  status: user_confirmed_camera_mount_provisional
  xyz_m: [0.055, 0.0, 0.145]
  rpy_rad: [0.0, 0.0, 0.0]
  width_px: 1280
  height_px: 720
  rate_hz: 60.0
  horizontal_fov_deg: 62.2
  # 제조사 전체 화각 H62.2/V48.8, 720p60. 여기서는 H62.2를 유지한 16:9 핀홀(V약37.5) 가정.
  # Jetson 모드별 실제 크롭·왜곡/노출/롤링셔터는 실측 전이다. 브래킷/케이블 질량 제외.
  mass_kg: 0.003
  proxy_size_m: [0.009, 0.025, 0.024]
  source: https://www.arducam.com/90524.html
  manufacturer_manual_mirror: https://download.kamami.pl/p1178777-B0390_Manual.pdf
lidar:
  model: RPLIDAR_C1
  status: user_confirmed_model_mount_provisional
  # 임시 JR60P20: 회전축 차체 중심 +60 mm, 광축 지상 75 mm. 확정 CAD 아님.
  xyz_m: [0.060, 0.0, 0.075]
  # 후방 각도 마스크 없음; 구조 그림자는 지주와 배선 예약 외곽만 반영.
  masked_rear_half_angle_deg: 0.0
  # 스캔면 Ø7 지주 [x, y, 지름] m. 표시 형상(자기반환)만, 질량/충돌 불변.
  scan_plane_posts: [[0.020, 0.062, 0.007], [0.020, -0.062, 0.007], [-0.080, 0.052, 0.007], [-0.080, -0.052, 0.007]]
  # 단순 차체 표시 상자(윗면 92.5 mm)가 75 mm 스캔면을 덮지 않게 위면만 65 mm로. 실제 차체 형상 아님.
  chassis_visual_top_m: 0.065
  # 배선 예약 외곽(실제 U채널 CAD 아님): 각 뒤 지주 바깥, 센서→지주 방향 반대편의 U채널
  # 외곽 접선폭 16 × 반경깊이 12 mm(벽 2 mm)를 외접원 Ø20 mm 원기둥으로 보수적으로 감쌌다.
  # 중심 = 지주 + (3.5 + 6) mm × 센서→지주 단위벡터(µm 반올림). 표시·광선 가림 전용, 질량/충돌 불변.
  scan_plane_wires: [[-0.088906, 0.055308, 0.020], [-0.088906, -0.055308, 0.020]]
  known_structure_mask: structure_aware
  known_structure_margin_deg: 0.5
  rate_hz: 10.0
imu:
  model: LSM6DSOX
  status: provisional_6axis_candidate
  xyz_m: [0.0, 0.0, 0.060]
  rate_hz: 208.0
  gyro_full_scale_dps: 500
  accel_full_scale_g: 8
  mass_kg: 0.003
  # 임의의 소규모 백색잡음. 제조사 잡음밀도를 표준편차로 오인하지 않는다.
  simulated_gyro_stddev_rad_s: 0.001
  simulated_accel_stddev_mps2: 0.01
  source: https://www.st.com/resource/en/datasheet/lsm6dsox.pdf
