# 단순 정적 장애물 감속/정지. 실차 제동거리·노면·센서 지연 실측 전 가정입니다.
tof_safety:
  ros__parameters:
    sensor_timeout_s: 0.30
    command_timeout_s: 0.30
    encoder_timeout_s: 0.15
    reaction_time_s: 0.15
    assumed_braking_deceleration_mps2: 2.0
    # 낮은 표적에 대해 3.5 m 최대 범위를 믿지 않습니다. 여전히 실물 보장 아님.
    assumed_detection_distance_m: 0.50
    stop_margin_m: 0.05
    clear_hold_s: 0.8
    control_rate_hz: 50.0
    minimum_obstacle_height_m: 0.015
    maximum_obstacle_height_m: 0.22
    swept_width_m: 0.17
    geometry_margin_m: 0.015
