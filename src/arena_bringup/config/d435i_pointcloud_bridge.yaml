# 대용량 포인트 클라우드는 구독할 때만 ROS 변환·전송합니다.
# CLI의 전역 lazy 인수에 의존하지 않고 각 브리지 설정에 명시합니다.
- ros_topic_name: /camera/depth/color/points
  gz_topic_name: /camera/depth/image_rect_raw/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  qos_profile: SENSOR_DATA
  lazy: true
