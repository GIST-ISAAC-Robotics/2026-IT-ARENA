# 2026-11-04 C1 장착 주행 비교 시험 전용 사본. 기본 b0183_c1.yaml에서 lidar 장착 키만 바꿨다.
# 구매 모델과 장착/오차 가정을 구분한 새 선택형 구성. 기존 vehicle.yaml 보존.
camera:
  model: Arducam_B0183_IMX219
  status: user_confirmed_camera_mount_provisional
  xyz_m: [0.055, 0.0, 0.145]
  rpy_rad: [0.0, 0.0, 0.0]
  width_px: 1280
  height_px: 720
  rate_hz: 60.0
  horizontal_fov_deg: 75.0
  # 720p 실제 크롭·왜곡/노출/롤링셔터는 미측정. 핀홀 가정.
  mass_kg: 0.010
  proxy_size_m: [0.020, 0.025, 0.025]
  source: https://docs.arducam.com/Nvidia-Jetson-Camera/Native-Camera/imx219/
lidar:
  model: RPLIDAR_C1
  status: user_confirmed_model_mount_provisional
  # 시험 전용 JR(11/3 기구 목업 제안): 회전축 차체 중심 +50 mm, 광축 지상 75 mm. 확정 CAD 아님.
  xyz_m: [0.050, 0.0, 0.075]
  masked_rear_half_angle_deg: 0.0
  # 스캔면 Ø7 지주 [x, y, 지름] m. 표시 형상(자기반환)만, 질량/충돌 불변.
  scan_plane_posts: [[0.010, 0.062, 0.007], [0.010, -0.062, 0.007], [-0.080, 0.052, 0.007], [-0.080, -0.052, 0.007]]
  # 단순 차체 표시 상자(윗면 92.5 mm)가 75 mm 스캔면을 덮지 않게 위면만 65 mm로. 실제 차체 형상 아님.
  chassis_visual_top_m: 0.065
  known_structure_mask: unknown
  known_structure_margin_deg: 0.5
  rate_hz: 10.0
imu:
  model: LSM6DSOX
  status: provisional_6axis_candidate
  xyz_m: [0.0, 0.0, 0.060]
  rate_hz: 208.0
  gyro_full_scale_dps: 500
  accel_full_scale_g: 8
  mass_kg: 0.003
  # 임의의 소규모 백색잡음. 제조사 잡음밀도를 표준편차로 오인하지 않는다.
  simulated_gyro_stddev_rad_s: 0.001
  simulated_accel_stddev_mps2: 0.01
  source: https://www.st.com/resource/en/datasheet/lsm6dsox.pdf
